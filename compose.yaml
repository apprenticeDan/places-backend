services:
  places-db:
    image: postgres:16
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
      POSTGRES_DB: appdb
    volumes:
      - places-pgdata:/var/lib/postgresql/data
      # Inyectar el script SQL automáticamente para inicializar la BD
      - ./base_de_datos/script_places.sql:/docker-entrypoint-initdb.d/1-script_places.sql:Z
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U appuser -d appdb" ]
      interval: 5s
      timeout: 5s
      retries: 5

  places-api:
    build:
      context: .
      dockerfile: Containerfile
    depends_on:
      places-db:
        condition: service_healthy
    volumes:
      # Montar directamente la carpeta places-backend en el espacio de trabajo
      - .:/workspace:Z
    ports:
      - "8080:8080"
    environment:
      CONNECTION_STRING: "Host=places-db;Database=appdb;Username=appuser;Password=apppass"
      ASPNETCORE_URLS: "http://0.0.0.0:8080"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
    stdin_open: true
    tty: true
    # Ejecutar la aplicación en modo watch para recarga automática
    command: dotnet watch run --project src/Places.Web/Places.Web.fsproj --urls http://0.0.0.0:8080

volumes:
  places-pgdata:
